name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Drop all permissions globally, then grant per-job as needed
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup show
      - run: cargo check --all-targets

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup install 1.85 --profile minimal
      - run: cargo +1.85 check --all-targets --all-features

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      matrix:
        # Lint the library under each cfg variant, plus all features at once.
        # `--all-features` auto-covers new features without editing this list.
        include:
          - { name: default, flags: "" }
          - { name: experimental, flags: "--features experimental" }
          - { name: kubernetes, flags: "--features kubernetes" }
          - { name: color, flags: "--features color" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup show
      - run: rustup component add clippy
      - run: cargo clippy -p cool-diff --all-targets ${{ matrix.flags }} -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      matrix:
        # Run the library's tests under each cfg variant, plus all features at
        # once. The experimental and kubernetes test files gate themselves on
        # their feature, so each is only exercised in a run that enables it.
        # `--all-features` auto-covers new features without editing this list.
        include:
          - { name: default, flags: "" }
          - { name: experimental, flags: "--features experimental" }
          - { name: kubernetes, flags: "--features kubernetes" }
          - { name: color, flags: "--features color" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup show
      - run: cargo test -p cool-diff ${{ matrix.flags }}

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup show
      - run: cargo doc -p cool-diff --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup show
      # TODO: speed up by using a pre-built binary instead of compiling from source
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout with full history
    # Only run on PRs, not pushes to main (needs a baseline to compare against)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # pre v2.9
