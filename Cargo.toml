[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NickLarsenNZ/cool-diff"

[workspace.dependencies]
owo-colors = "4"
serde_json = "1"
snafu = "0.9"
supports-color = "3"
indoc = "2"
rstest = "0.26"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[package]
name = "cool-diff"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compact, context-preserving diffs of structured data (serde_json::Value)"
keywords = ["diff", "yaml", "json", "kubernetes", "testing"]
categories = ["development-tools::testing", "algorithms", "value-formatting"]
readme = "README.md"
exclude = [".github/", "deny.toml", "RELEASE.md", "rust-toolchain.toml"]

[features]
color = ["dep:owo-colors", "dep:supports-color"]
experimental = []

[dependencies]
owo-colors = { workspace = true, optional = true }
serde_json = { workspace = true }
snafu = { workspace = true }
supports-color = { workspace = true, optional = true }

[dev-dependencies]
indoc = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }

[[example]]
name = "openapi_pod"
required-features = ["experimental"]
